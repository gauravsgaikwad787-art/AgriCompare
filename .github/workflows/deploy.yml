# Builds AgriCompare and publishes it to GitHub Pages.
# Runs on every push to main, every morning (to refresh the prices), and on demand
# from the Actions tab ("Run workflow").
#
# One-time setup on GitHub:
#   1. Settings > Pages > Build and deployment > Source: "GitHub Actions".
#   2. Settings > Secrets and variables > Actions > New repository secret:
#      Name: DATA_GOV_API_KEY   Value: your data.gov.in API key.
# The key is only used here to download prices; it is never put into the website.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * *' # every day at 07:00 India time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Save the latest official prices to public/data/prices.json.
      # If this fails, the site still builds and shows clearly labelled sample data.
      - run: npm run fetch-prices
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
